# GPU overlay for hosts with an NVIDIA GPU (e.g. RTX 4090).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requires NVIDIA driver >= 550 and NVIDIA Container Toolkit on the host.
# The MOSS runtime image must be built with TORCH_VARIANT=cu121 (see
# deploy/moss.Dockerfile); the app auto-detects cuda via torch.cuda.is_available().
#
# GPU selection: MOSS_GPU_ID pins the container to a single physical GPU
# (default 0). On a multi-GPU host shared with other workloads, point it at a
# free card, e.g. MOSS_GPU_ID=1. Inside the container the card is cuda:0.

services:
  moss:
    # GPU-exclusivity whitelist: this host runs model-platform-gpu-guard
    # (systemd), which SIGTERMs any GPU compute process whose container does
    # not carry the local-model-workers compose-project label. Tagging our own
    # container with that label keeps the guard intact for everyone else while
    # letting MOSS use the pinned GPU.
    labels:
      - "com.docker.compose.project=local-model-workers"
    environment:
      # Force FunASR onto the GPU; remove to fall back to auto-detection.
      MOSS_DEVICE: cuda
      # Keep llama-cli (summary model) on CPU by default: 4B Q4 generates in
      # ~30-60s on server CPUs and a CUDA llama.cpp build would triple the
      # image build time. Promote to GPU later by rebuilding with
      # -DGGML_CUDA=ON and adding appropriate flags here if needed.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MOSS_GPU_ID:-0}"]
              capabilities: [gpu]
