# TLS reverse proxy for the video-transcribe-platform (10.0.0.33:18443).
# Terminates self-signed TLS and proxies everything into the compose network:
#   /api/*  -> api:8000   (FastAPI, incl. SSE + WebSocket under /api/v1/...)
#   /*      -> web:3000   (Next.js)
# One port serves both so the browser sees a single secure origin
# (getUserMedia requires a secure context).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  server_name 10.0.0.33;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Meeting audio uploads go up to ~512 MB (MOSS_MAX_SOURCE_MB) plus overhead.
  client_max_body_size 700m;

  # --- API (REST + SSE + WebSocket) ---
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # WebSocket upgrade (live transcription); harmless for plain requests.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # SSE: never buffer, and outlive long-running streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # --- Web (Next.js) ---
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
